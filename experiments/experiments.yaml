experiment_name: pointcloud-triplet

defaults:
  data_dir: "D:/thresh105_qr120_umbral008_acomodado"
  runs_dir: "runs"
  val_size: 0.15
  test_size: 0.15
  n_points: 512
  width: 8
  epochs: 200
  batch_size: 16
  lr: 0.0003
  margin: 0.5
  clip_norm: 1.0
  seed: 42
  sampling: random
  lazy: false

runs:
  # FASE 1 - Exploracion (200 epochs), en el orden de docs/GUIA_EXPERIMENTOS.md.
  - run_name: w8_np512_m0.5_lr3e-4_bs16_seed42_fpsbaya
    width: 8
    lr: 0.0003
    sampling: fps_baya

  - run_name: w8_np512_m0.5_lr1e-3_bs16_seed42_fps
    width: 8
    lr: 0.001
    sampling: fps

  - run_name: w8_np512_m0.5_lr5e-4_bs16_seed42_fps
    width: 8
    lr: 0.0005
    sampling: fps

  - run_name: w8_np512_m0.5_lr1e-4_bs16_seed42_fps
    width: 8
    lr: 0.0001
    sampling: fps

  - run_name: w16_np512_m0.5_lr3e-4_bs16_seed42_fps
    width: 16
    lr: 0.0003
    sampling: fps

  - run_name: w32_np512_m0.5_lr3e-4_bs16_seed42_fps
    width: 32
    lr: 0.0003
    sampling: fps

  # Gate fps_baya: generar/correr estos solo si #1 da test acc >= 0.19.
  - run_name: w8_np512_m0.5_lr1e-3_bs16_seed42_fpsbaya
    width: 8
    lr: 0.001
    sampling: fps_baya

  - run_name: w8_np512_m0.5_lr5e-4_bs16_seed42_fpsbaya
    width: 8
    lr: 0.0005
    sampling: fps_baya

  - run_name: w8_np512_m0.5_lr1e-4_bs16_seed42_fpsbaya
    width: 8
    lr: 0.0001
    sampling: fps_baya
